spring:
  application:
    name: consultant-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/consultant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  web:
    resources:
      add-mappings: false

  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com:
      cms: DEBUG
