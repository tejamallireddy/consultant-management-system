<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Dashboard', ~{::content})}">
<body>
<div th:fragment="content">

    <h3 class="mb-4">Dashboard</h3>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card border-primary-subtle bg-primary-subtle h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-people-fill fs-1 text-primary"></i>
                    <div>
                        <div class="text-muted small">Total Consultants</div>
                        <div class="fs-3 fw-semibold" th:text="${total}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-success-subtle bg-success-subtle h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-person-plus-fill fs-1 text-success"></i>
                    <div>
                        <div class="text-muted small">New This Month</div>
                        <div class="fs-3 fw-semibold" th:text="${newThisMonth}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-warning-subtle bg-warning-subtle h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-check-circle-fill fs-1 text-warning"></i>
                    <div>
                        <div class="text-muted small">Active Consultants</div>
                        <div class="fs-3 fw-semibold" th:text="${active}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-danger-subtle bg-danger-subtle h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-person-x-fill fs-1 text-danger"></i>
                    <div>
                        <div class="text-muted small">Inactive Consultants</div>
                        <div class="fs-3 fw-semibold" th:text="${inactive}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h5 class="mb-3">Latest Consultants</h5>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Name</th><th>Email</th><th>Technology</th>
                    <th>Experience (Years)</th><th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${latest}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.technology}"></td>
                    <td th:text="${c.experience}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${c.status.label}"></span>
                    </td>
                    <td class="text-nowrap">
                        <a th:href="@{/consultants/{id}/edit(id=${c.id})}"
                           class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/consultants/{id}/delete(id=${c.id})}"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(latest)}">
                    <td colspan="7" class="text-center text-muted py-4">No consultants yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/consultants}" class="btn btn-primary">View All Consultants</a>
    </div>

</div>
</body>
</html>
