<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Consultants', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">All Consultants</h3>
        <a th:href="@{/consultants/new}" class="btn btn-primary">Add Consultant</a>
    </div>

    <form th:action="@{/consultants}" method="get" class="row g-2 mb-3">
        <div class="col-sm-8 col-md-6">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="Search by name or technology">
        </div>
        <div class="col-auto">
            <button class="btn btn-success" type="submit">Search</button>
            <a th:href="@{/consultants}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
                    <th>Technology</th><th>Exp (Yrs)</th><th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${consultants}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.phone}"></td>
                    <td th:text="${c.technology}"></td>
                    <td th:text="${c.experience}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${c.status.label}"></span>
                    </td>
                    <td class="text-nowrap">
                        <a th:href="@{/consultants/{id}/edit(id=${c.id})}"
                           class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/consultants/{id}/delete(id=${c.id})}"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(consultants)}">
                    <td colspan="8" class="text-center text-muted py-4">No consultants found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/consultants(page=${page.number - 1}, keyword=${keyword})}">&laquo;</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                class="page-item" th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/consultants(page=${i}, keyword=${keyword})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/consultants(page=${page.number + 1}, keyword=${keyword})}">&raquo;</a>
            </li>
        </ul>
    </nav>

    <p class="text-center text-muted small mt-2"
       th:if="${page.totalElements > 0}"
       th:text="'Showing ' + ${page.numberOfElements} + ' of ' + ${page.totalElements} + ' consultants'"></p>

</div>
</body>
</html>
