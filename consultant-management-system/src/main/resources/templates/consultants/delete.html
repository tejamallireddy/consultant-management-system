<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Delete Consultant', ~{::content})}">
<body>
<div th:fragment="content">

    <h3 class="mb-4">Delete Consultant</h3>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-danger-subtle">
                <div class="card-body text-center p-4">

                    <i class="bi bi-exclamation-circle text-danger" style="font-size:4rem;"></i>

                    <p class="mt-3 mb-1">Are you sure you want to delete</p>
                    <h4 class="fw-bold" th:text="${consultant.name} + '?'">Name?</h4>
                    <p class="text-muted">This action cannot be undone.</p>

                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <form th:action="@{/consultants/{id}/delete(id=${consultant.id})}" method="post">
                            <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        </form>
                        <a th:href="@{/consultants}" class="btn btn-secondary">Cancel</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
